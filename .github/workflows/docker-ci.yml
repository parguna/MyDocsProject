name: Build and Publish Docker Images

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/parguna/mydocsproject

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # wwwroot/libs (bundled CSS/JS like abp.css) is gitignored — the ABP template expects
      # it to be restored via the ABP CLI, not committed. Without this, Web.Tests fails with
      # "Could not find file '/libs/abp/core/abp.css'" because the bundling middleware can't
      # find files that were never checked out on the runner.
      - name: Restore client-side libraries (abp install-libs)
        run: |
          dotnet tool install -g Volo.Abp.Studio.Cli
          export PATH="$PATH:$HOME/.dotnet/tools"
          abp install-libs -wd src/MyDocsProject.Web

      - name: Restore
        run: dotnet restore MyDocsProject.slnx

      - name: Build
        run: dotnet build MyDocsProject.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MyDocsProject.slnx --configuration Release --no-build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/MyDocsProject.Web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}

      - name: Build and push DbMigrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/MyDocsProject.DbMigrator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-dbmigrator:latest
            ${{ env.IMAGE_PREFIX }}-dbmigrator:${{ github.sha }}
