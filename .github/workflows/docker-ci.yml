name: Docker CI

# Only master pushes trigger this. Nothing else (no PRs, no other branches, no manual dispatch).
on:
  push:
    branches:
      - master

# Least privilege: read the repo, write packages (to push to GHCR). Nothing else.
permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyDocsProject.slnx

      - name: Build
        run: dotnet build MyDocsProject.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MyDocsProject.slnx --configuration Release --no-build

      - name: Compute image name
        id: image
        # GHCR requires lowercase repository paths; github.repository can contain uppercase.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MyDocsProject.Web/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
